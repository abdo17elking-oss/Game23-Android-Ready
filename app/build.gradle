plugins {
    id 'com.android.application'
}

android {
    namespace 'com.game23.android'
    compileSdk 35

    defaultConfig {
        applicationId "com.game23.android"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

